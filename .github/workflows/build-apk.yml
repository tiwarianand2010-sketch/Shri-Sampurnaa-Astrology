name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Force Fix Android v2 Embedding Completely
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/shri_sampurnaa_astrology
          
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <application android:label="Shri Sampurna Astrology" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">\n        <meta-data android:name="flutterEmbedding" android:value="2" />\n        <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">\n            <meta-data android:name="io.flutter.app.android.SplashScreenUntilFirstFrame" android:value="true" />\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN"/>\n                <category android:name="android.intent.category.LAUNCHER"/>\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>' > android/app/src/main/AndroidManifest.xml

          printf 'package com.example.shri_sampurnaa_astrology\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}' > android/app/src/main/kotlin/com/example/shri_sampurnaa_astrology/MainActivity.kt
          
          rm -rf android/app/src/main/java

      - name: Get dependencies
        run: flutter pub get --no-example

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
